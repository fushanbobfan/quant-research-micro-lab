[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-micro-lab"
version = "1.0.0"
description = "Inspectable tools for small quantitative research experiments"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
quant-backtest = "quant_research_micro_lab.cli:main"
quant-benchmark = "quant_research_micro_lab.benchmark:main"
quant-bootstrap = "quant_research_micro_lab.bootstrap:main"
quant-correlation-drift = "quant_research_micro_lab.correlation_drift:main"
quant-cost-sensitivity = "quant_research_micro_lab.cost_sensitivity:main"
quant-dependence = "quant_research_micro_lab.dependence:main"
quant-exposure = "quant_research_micro_lab.exposure:main"
quant-panel-coverage = "quant_research_micro_lab.panel_coverage:main"
quant-price-audit = "quant_research_micro_lab.price_audit:main"
quant-risk = "quant_research_micro_lab.risk:main"
quant-risk-contrib = "quant_research_micro_lab.risk_contribution:main"
quant-rolling = "quant_research_micro_lab.rolling:main"
quant-sweep = "quant_research_micro_lab.sweep:main"
quant-stress = "quant_research_micro_lab.stress:main"
quant-tail-risk = "quant_research_micro_lab.tail_risk:main"
quant-trades = "quant_research_micro_lab.trades:main"
quant-turnover = "quant_research_micro_lab.turnover:main"
quant-var-backtest = "quant_research_micro_lab.var_backtest:main"
quant-walk-forward = "quant_research_micro_lab.walk_forward:main"

[tool.setuptools.packages.find]
where = ["src"]
